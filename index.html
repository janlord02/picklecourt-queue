  <body>
    <!-- Pre-JS loading state: visible from the very first paint until the
         Vue app mounts (App.vue removes it), where AppSplash.vue takes over
         seamlessly on the same white background. -->
    <div
      id="preload-splash"
      style="
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #ffffff;
      "
    >
      <img src="/icons/picklecourt-icon.png" width="72" height="72" alt="PickleCourt" />
      <div
        style="
          width: 26px;
          height: 26px;
          border: 3px solid #d9efe9;
          border-top-color: #0c2b23;
          border-radius: 50%;
          animation: preload-spin 0.9s linear infinite;
        "
      ></div>
    </div>
    <style>
      @keyframes preload-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
    <!-- quasar:entry-point -->
